<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#B8955E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#B8955E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#5C6B3A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5C6B3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1DFB0"/>
      <stop offset="45%" stop-color="#E4C98E"/>
      <stop offset="100%" stop-color="#C7A868"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%" stop-color="#C7A868"/>
      <stop offset="55%" stop-color="#A6863F"/>
      <stop offset="100%" stop-color="#8B7333"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7333"/>
      <stop offset="55%" stop-color="#5F5828"/>
      <stop offset="100%" stop-color="#3D4E1F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#F5EFE0"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- thin gold frame -->
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#B8955E" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M28 68 L28 28 L68 28" fill="none" stroke="#8A7043" stroke-width="2"/>
  <path d="M1172 68 L1172 28 L1132 28" fill="none" stroke="#8A7043" stroke-width="2"/>
  <path d="M28 562 L28 602 L68 602" fill="none" stroke="#8A7043" stroke-width="2"/>
  <path d="M1172 562 L1172 602 L1132 602" fill="none" stroke="#8A7043" stroke-width="2"/>

  <!-- cube mark, centered -->
  <g transform="translate(500,90) scale(1.0)">
    <path d="M 100 70 L 165 105 L 165 165 L 100 200 Z" fill="url(#cubeRight)"/>
    <path d="M 100 70 L 35 105 L 35 165 L 100 200 Z" fill="url(#cubeLeft)"/>
    <path d="M 100 35 L 165 70 L 100 105 L 35 70 Z" fill="url(#cubeTop)"/>
    <path d="M 100 35 L 165 70 L 100 105 L 35 70 Z" fill="none" stroke="#F8ECCB" stroke-width="0.9" stroke-opacity="0.7"/>
    <path d="M 100 60 L 108 70 L 100 80 L 92 70 Z" fill="none" stroke="#5F5828" stroke-width="1.1" stroke-opacity="0.55"/>
    <text x="67" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="600" font-style="italic" fill="#FBF6EA">M</text>
  </g>

  <!-- Arabic name -->
  <text x="600" y="345" text-anchor="middle" font-family="Amiri, Georgia, serif" font-size="52" font-weight="700" fill="#2A3316">د. محمود مراد أبو شعيره</text>

  <!-- divider -->
  <line x1="520" y1="375" x2="680" y2="375" stroke="#B8955E" stroke-width="1"/>
  <path d="M600 368 L607 375 L600 382 L593 375 Z" fill="#8A7043"/>

  <!-- English name -->
  <text x="600" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="8" fill="#8A7043">DR. MAHMOUD MURAD</text>

  <!-- tagline -->
  <text x="600" y="452" text-anchor="middle" font-family="Amiri, Georgia, serif" font-size="21" fill="#4A5237">الطب التجميلي  ·  عمّان</text>
  <text x="600" y="486" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" letter-spacing="1" fill="#6B7A3F">Aesthetic Medicine · Amman</text>
</svg>
